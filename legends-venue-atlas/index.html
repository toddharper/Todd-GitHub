<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Venue Network Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Setup / sign-in / not-on-list screens -->
<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <h1>Venue Network Atlas</h1>
    <p>Loading…</p>
  </div>
</div>

<!-- Signed-in app -->
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">
      <h1>Venue Network Atlas</h1>
      <div class="sub">Sites, circuits, addressing and diagrams</div>
    </div>
    <div class="me">
      <span class="who" id="meEmail"></span>
      <span class="role-pill" id="meRole"></span>
      <button class="btn ghost small" id="signOut">Sign out</button>
    </div>
    <label class="label" for="q" hidden>Search venues</label>
    <input id="q" class="search" type="search" placeholder="Search name, contact, circuit ID, IP…" autocomplete="off">
    <div class="groups" id="groups" role="group" aria-label="Filter venues"></div>
    <div class="rail-row">
      <span class="count" id="count">Loading venues…</span>
      <button class="btn primary small" id="addVenue" hidden>+ Add venue</button>
    </div>
    <ul class="venue-list" id="list" aria-label="Venues"></ul>
    <div class="rail-foot" id="adminTools" hidden>
      <button class="btn small" id="openAccess">Manage access</button>
      <button class="btn small" id="exportJson">Export JSON</button>
      <button class="btn small" id="exportCsv">Export CSV</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
